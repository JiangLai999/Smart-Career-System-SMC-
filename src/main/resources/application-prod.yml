spring:
  datasource:
    url: jdbc:mysql://${PROD_DB_HOST:prod-db-server}:3306/smart_career?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${PROD_DB_USERNAME:prod_user}
    password: ${PROD_DB_PASSWORD:change_me_in_production}
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    com.example.smartcareer: INFO
    org.springframework.web: WARN
